name: Sync RPM repository

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rpm-repository
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c jq

      - name: Download latest RPMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          : > public/UPSTREAM_VERSIONS

          download_rpms() {
            local upstream="$1"
            local pattern="$2"
            local repo_json tag
            repo_json="$(curl --fail-with-body --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              "https://api.github.com/repos/${upstream}/releases/latest")"
            tag="$(jq -r '.tag_name' <<<"${repo_json}")"
            test -n "${tag}" -a "${tag}" != "null"
            mapfile -t assets < <(jq -r --arg pattern "${pattern}" \
              '.assets[] | select(.name | test($pattern)) | [.name, .browser_download_url] | @tsv' \
              <<<"${repo_json}")
            test "${#assets[@]}" -eq 2
            for asset in "${assets[@]}"; do
              IFS=$'\t' read -r name url <<<"${asset}"
              curl --fail-with-body --location --silent --show-error --retry 3 \
                --output "public/${name}" "${url}"
            done
            printf '%s %s\n' "${upstream}" "${tag}" >> public/UPSTREAM_VERSIONS
          }

          download_rpms 'farion1231/cc-switch' 'Linux-(x86_64|arm64)\.rpm$'
          download_rpms 'Voxelum/x-minecraft-launcher' 'xmcl-.*-(aarch64|x86_64)\.rpm$'
          download_rpms 'YAQMC/YAQMC' 'YAQMC-linux-(arm64|x64)\.rpm$'
          download_rpms 'AnInsomniacy/rayburst' 'Rayburst-.*\.(aarch64|x86_64)\.rpm$'
          download_rpms 'clash-verge-rev/clash-verge-rev' 'Clash\.Verge-.*-(aarch64|x86_64)\.rpm$'
          download_rpms 'chen08209/FlClash' 'FlClash-.*-linux-(amd64|arm64)\.rpm$'

      - name: Generate unified Fedora repository metadata
        run: |
          set -euo pipefail
          createrepo_c --database public
          printf '%s\n' \
            '[hare-rpm-repo]' \
            'name=Hare RPM Repository' \
            'baseurl=https://raw.githubusercontent.com/Yohane-Mashiro/hare-rpm-repo/gh-pages/' \
            'enabled=1' \
            'gpgcheck=0' \
            'repo_gpgcheck=0' \
            > public/hare-rpm-repo.repo

      - name: Publish repository branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          publish_dir=$(mktemp -d)
          cp -a public/. "${publish_dir}/"
          git checkout --orphan gh-pages
          git rm -rf .
          rm -rf public
          cp -a "${publish_dir}/." .
          git add .
          git commit -m 'Sync unified RPM repository'
          git push origin gh-pages --force
