name: Sync CC-Switch RPM repository

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rpm-repository
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y createrepo-c jq

      - name: Download latest upstream RPMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf public
          mkdir -p public
          release_json="$(curl --fail-with-body --silent --show-error \\
            -H "Authorization: Bearer ${GH_TOKEN}" \\
            -H 'Accept: application/vnd.github+json' \\
            https://api.github.com/repos/farion1231/cc-switch/releases/latest)"
          tag="$(jq -r '.tag_name' <<<"${release_json}")"
          test -n "${tag}" -a "${tag}" != "null"
          jq -r '.assets[] | select(.name | test("Linux-(x86_64|arm64)\\.rpm$")) | [.name, .browser_download_url] | @tsv' <<<"${release_json}" \\
            | while IFS=$'\t' read -r name url; do
                curl --fail-with-body --location --silent --show-error --retry 3 \\
                  --output "public/${name}" "${url}"
              done
          test "$(find public -maxdepth 1 -name '*.rpm' -type f | wc -l)" -eq 2
          printf '%s\n' "${tag}" > public/UPSTREAM_VERSION

      - name: Generate Fedora repository metadata
        run: |
          set -euo pipefail
          createrepo_c --database public
          cat > public/cc-switch.repo <<'REPO'
          [cc-switch]
          name=CC-Switch RPM Repository
          baseurl=https://raw.githubusercontent.com/Yohane-Mashiro/hare-rpm-repo/gh-pages/
          enabled=1
          gpgcheck=0
          repo_gpgcheck=0
          REPO
          sed -i 's/^          //' public/cc-switch.repo

      - name: Publish repository branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --orphan gh-pages
          git rm -rf .
          cp -a public/. .
          git add .
          git commit -m "Sync CC-Switch RPM repository"
          git push origin gh-pages --force
